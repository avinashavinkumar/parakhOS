services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studentos
      POSTGRES_USER: student_os
      POSTGRES_PASSWORD: student_os
    ports:
      - "5432:5432"
    volumes:
      - student-os-postgres:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  student-os-postgres:
